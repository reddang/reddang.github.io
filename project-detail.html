<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title> <!-- JS will update this -->
    <link rel="stylesheet" href="style.css?v=20260906-order-badges">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">

</head>

<body>

    <div id="header-placeholder"></div>

    <main class="container">
        <!-- Header dự án -->
        <div class="project-header">
            <h1 id="p-title">Loading...</h1>
            <div class="meta-info">
                <span>
                    <normal id="p-category"></normal>
                </span>
                <span>
                    <normal id="p-project"></normal>
                </span>
                <span>
                    <normal id="p-company-meta"></normal>
                </span>
                <span>
                    <normal id="p-date"></normal>
                </span>
            </div>
        </div>

        <!-- Company Info Section -->
        <div class="company-info" id="p-company-section" style="display: none;">
            <div
                style="display: flex; align-items: center; gap: 20px; margin: 30px 0; padding: 20px; background: #f5f5f5; border-radius: 8px;">
                <img id="p-company-logo" src="" alt="Company Logo" style="max-width: 150px; height: auto;">
                <div>
                    <div><strong>Company:</strong> <span id="p-company"></span></div>
                    <div><strong>Location:</strong> <span id="p-location"></span></div>
                </div>
            </div>
        </div>

        <!-- Navigation Next/Prev -->
        <div class="project-nav">
            <a href="#" class="nav-btn btn-prev"><i class="fas fa-arrow-left"></i> Previous project</a>
            <a href="#" class="nav-btn btn-next">Next project <i class="fas fa-arrow-right"></i></a>
        </div>

        <!-- Mô tả & Links -->
        <div class="project-desc-section" id="p-content-section" style="display: none;">
            <h2>Project Description</h2>
            <div class="project-desc" id="p-content"></div>
            <div class="project-links" id="p-links" style="display: none;"></div>
        </div>

        <!-- Khu vực hiển thị Ảnh/Video -->
        <div class="media-container" id="p-media"></div>

        <!-- Screenshots Section (New) -->
        <div class="screenshots-section" id="p-screenshots-section" style="display: none; margin-top: 40px;">
            <h2 style="margin-bottom: 20px;">Screenshots</h2>
            <div id="p-screenshots"></div>
        </div>

        <!-- Navigation Next/Prev -->
        <div class="project-nav">
            <a href="#" class="nav-btn btn-prev"><i class="fas fa-arrow-left"></i> Previous project</a>
            <a href="#" class="nav-btn btn-next">Next project <i class="fas fa-arrow-right"></i></a>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js?v=20260906-clean-company"></script>
</body>

</html>
